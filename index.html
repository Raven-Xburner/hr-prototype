<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR人事管理系统 - 原型</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f1f5f9; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1e293b; z-index: 100; overflow-y: auto; }
.sidebar-logo { padding: 20px 16px; color: #fff; font-size: 18px; font-weight: 700; border-bottom: 1px solid #334155; }
.sidebar-nav { padding: 8px 0; }
.nav-item { display: flex; align-items: center; padding: 12px 20px; color: #94a3b8; cursor: pointer; transition: all .2s; font-size: 14px; }
.nav-item:hover { background: #334155; color: #e2e8f0; }
.nav-item.active { background: #3b82f6; color: #fff; }
.nav-item .nav-icon { width: 20px; margin-right: 10px; text-align: center; }
.main-content { margin-left: 220px; margin-right: 320px; padding: 24px; min-height: 100vh; transition: margin-right .3s; }
.main-content.full-width { margin-right: 0; }
.prd-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; background: #fffbeb; border-left: 1px solid #fbbf24; overflow-y: auto; z-index: 100; padding: 20px; transition: transform .3s; }
.prd-panel.hidden { transform: translateX(100%); }
.prd-toggle { position: fixed; right: 320px; top: 50%; transform: translateY(-50%); z-index: 101; background: #f59e0b; color: #fff; border: none; padding: 12px 6px; cursor: pointer; border-radius: 6px 0 0 6px; writing-mode: vertical-rl; font-size: 12px; transition: right .3s; }
.prd-toggle.panel-hidden { right: 0; }
.prd-note { background: #fff; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.6; }
.prd-note.boundary { border-color: #93c5fd; background: #f0f7ff; }
.prd-note.boundary .prd-note-title { color: #1d4ed8; }
.prd-note.boundary .prd-note-title::before { content: '📐'; margin-right: 4px; }
.prd-note-title { font-weight: 700; color: #92400e; margin-bottom: 6px; font-size: 13px; }
.highlight { background: #fef08a; padding: 1px 4px; border-radius: 3px; }
.flow { background: #dcfce7; border: 1px solid #86efac; border-radius: 6px; padding: 10px; margin: 8px 0; font-size: 12px; color: #166534; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; color: #1e293b; }
.btn-primary { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background .2s; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn-secondary:hover { background: #f9fafb; }
.btn-danger { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 4px; }
.filter-bar { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.filter-item { display: flex; flex-direction: column; gap: 4px; }
.filter-item label { font-size: 12px; color: #6b7280; }
.filter-item input, .filter-item select { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; min-width: 140px; }
.table-container { background: #fff; border-radius: 8px; overflow-x: auto; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.topbar { position: sticky; top: 0; z-index: 90; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.95); backdrop-filter: blur(6px); padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.breadcrumb { font-size: 13px; color: #6b7280; display: flex; align-items: center; gap: 6px; }
.breadcrumb .crumb-home { color: #94a3b8; }
.breadcrumb .crumb-sep { color: #cbd5e1; }
.breadcrumb .crumb-group { color: #6b7280; }
.breadcrumb .crumb-cur { color: #1e293b; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-date { font-size: 13px; color: #6b7280; }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1e293b; font-weight: 500; }
.user-avatar { width: 28px; height: 28px; border-radius: 50%; background: #3b82f6; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.page-title-wrap { display: flex; flex-direction: column; gap: 2px; }
.page-sub { font-size: 13px; color: #6b7280; font-weight: 400; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: #f8fafc; }
th { padding: 12px 14px; text-align: left; font-weight: 600; color: #374151; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; color: #4b5563; }
tr:hover { background: #f8fafc; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.badge-blue { background: #dbeafe; color: #1d4ed8; }
.badge-green { background: #dcfce7; color: #166534; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-yellow { background: #fef9c3; color: #854d0e; }
.badge-purple { background: #f3e8ff; color: #6b21a8; }
.badge-gray { background: #f3f4f6; color: #4b5563; }
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.page-btns { display: flex; gap: 4px; }
.page-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-size: 13px; background: #fff; }
.page-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.page-btn:hover:not(.active) { background: #f3f4f6; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: center; justify-content: center; }
.modal-overlay.hidden { display: none; }
.modal { background: #fff; border-radius: 12px; max-height: 90vh; overflow-y: auto; width: 90%; max-width: 800px; padding: 24px; position: relative; }
.modal-lg { max-width: 1100px; }
.modal-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #e5e7eb; }
.modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; font-size: 20px; color: #6b7280; }
.modal-close:hover { background: #f3f4f6; }
.form-section { margin-bottom: 20px; }
.form-section-title { background: #eff6ff; color: #1d4ed8; padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.form-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; color: #6b7280; font-weight: 500; }
.form-group label .req { color: #ef4444; }
.form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; transition: border-color .2s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.1); }
.form-group input.error, .form-group select.error, .form-group textarea.error { border-color: #ef4444; }
.form-group .error-msg { color: #ef4444; font-size: 11px; display: none; }
.form-group input.error ~ .error-msg, .form-group select.error ~ .error-msg, .form-group textarea.error ~ .error-msg { display: block; }
.form-group input:disabled, .form-group select:disabled { background: #f3f4f6; color: #9ca3af; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 999; font-size: 14px; animation: toastIn .3s; }
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.tab-bar { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 16px; }
.tab-item { padding: 10px 16px; cursor: pointer; font-size: 14px; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab-item.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
.tab-item:hover { color: #3b82f6; }
.dynamic-row { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 8px; padding: 10px; background: #f8fafc; border-radius: 6px; }
.add-row-btn { color: #3b82f6; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }
.add-row-btn:hover { text-decoration: underline; }
.remove-row-btn { color: #ef4444; cursor: pointer; font-size: 18px; padding: 4px 8px; }
.detail-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
.detail-tab { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; background: #f3f4f6; color: #4b5563; }
.detail-tab.active { background: #3b82f6; color: #fff; }
.detail-content { min-height: 200px; }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.info-item { padding: 8px 0; }
.info-item .info-label { font-size: 12px; color: #9ca3af; margin-bottom: 2px; }
.info-item .info-value { font-size: 14px; color: #1e293b; font-weight: 500; }
.checklist-section { margin-bottom: 16px; }
.checklist-title { font-weight: 600; font-size: 14px; color: #374151; margin-bottom: 8px; }
.checklist-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: #4b5563; }
.checklist-item input[type="checkbox"] { width: 16px; height: 16px; }
.warning-box { background: #fef9c3; border: 1px solid #fbbf24; border-radius: 6px; padding: 10px 14px; font-size: 13px; color: #92400e; margin-bottom: 12px; }
.page-size-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: #6b7280; }
.page-size-bar select { padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
.color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.op-link { color: #3b82f6; cursor: pointer; font-size: 12px; margin-right: 8px; }
.op-link:hover { text-decoration: underline; }
.op-link.danger { color: #ef4444; }
.op-link.disabled { display: none; }
.confirm-box { text-align: center; padding: 20px 0; }
.confirm-box .confirm-icon { font-size: 40px; margin-bottom: 12px; }
.confirm-box .confirm-msg { font-size: 15px; color: #374151; margin-bottom: 8px; line-height: 1.6; }
.confirm-box .confirm-sub { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
.confirm-btns { display: flex; justify-content: center; gap: 12px; }
.confirm-btns .btn-cancel { background: #fff; color: #374151; border: 1px solid #d1d5db; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.confirm-btns .btn-confirm { background: #3b82f6; color: #fff; border: none; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.confirm-btns .btn-confirm-danger { background: #ef4444; color: #fff; border: none; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.link-display { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 14px 16px; margin: 12px 0; display: flex; align-items: center; gap: 10px; }
.link-display input { flex: 1; border: none; background: transparent; font-size: 13px; color: #0369a1; outline: none; }
.link-display .copy-btn { background: #0ea5e9; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.nav-group-header { display: flex; align-items: center; padding: 12px 20px; color: #94a3b8; cursor: pointer; transition: all .2s; font-size: 14px; font-weight: 600; background: #162033; border-bottom: 1px solid #1e293b; }
.nav-group-header:hover { background: #1e293b; color: #e2e8f0; }
.nav-group-header .nav-icon { width: 20px; margin-right: 10px; text-align: center; }
.nav-group-header .arrow { margin-left: auto; font-size: 10px; transition: transform .2s; }
.nav-group-header.collapsed .arrow { transform: rotate(-90deg); }
.nav-sub-item { display: flex; align-items: center; padding: 10px 20px 10px 44px; color: #94a3b8; cursor: pointer; transition: all .2s; font-size: 13px; }
.nav-sub-item:hover { background: #334155; color: #e2e8f0; }
.nav-sub-item.active { background: #3b82f6; color: #fff; }
.nav-sub-item .nav-icon { width: 18px; margin-right: 8px; text-align: center; font-size: 13px; }
.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.stat-card .stat-label { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
.stat-card .stat-value { font-size: 24px; font-weight: 700; color: #1e293b; }
.stat-card .stat-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
.shift-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.shift-card .shift-name { font-size: 15px; font-weight: 700; color: #1e293b; }
.shift-card .shift-time { font-size: 13px; color: #3b82f6; font-weight: 600; }
.shift-card .shift-meta { font-size: 12px; color: #6b7280; }
.flow-steps { display:flex;align-items:center;gap:0;margin:20px 0;padding:16px 20px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow-x:auto; }
.flow-step { display:flex;flex-direction:column;align-items:center;gap:6px;min-width:90px; }
.flow-step .step-circle { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;background:#d1d5db; }
.flow-step .step-circle.done { background:#22c55e; }
.flow-step .step-circle.active { background:#3b82f6;animation:pulse 2s infinite; }
.flow-step .step-circle.pending { background:#d1d5db; }
.flow-step .step-label { font-size:12px;color:#6b7280;text-align:center;white-space:nowrap; }
.flow-step .step-label.active { color:#3b82f6;font-weight:600; }
.flow-arrow { font-size:18px;color:#d1d5db;margin:0 2px;flex-shrink:0; }
.flow-arrow.done { color:#22c55e; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4);} 50%{box-shadow:0 0 0 8px rgba(59,130,246,0);} }
.grade-bar { display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px; }
.grade-bar .bar-label { width:24px;font-weight:700;text-align:center; }
.grade-bar .bar-track { flex:1;height:24px;background:#f3f4f6;border-radius:4px;position:relative;overflow:hidden; }
.grade-bar .bar-fill { height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600;min-width:30px;transition:width .5s; }
.grade-bar .bar-target { position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:1; }
.grade-bar .bar-value { width:70px;text-align:right;font-size:12px;color:#6b7280; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">HR人事管理</div>
  <div class="sidebar-nav" id="sidebarNav"></div>
</div>

<!-- PRD Toggle -->
<button class="prd-toggle" id="prdToggle" onclick="togglePrdPanel()">PRD标注</button>

<!-- PRD Panel -->
<div class="prd-panel" id="prdPanel">
  <h3 style="font-size:16px;font-weight:700;color:#92400e;margin-bottom:16px;">PRD 产品标注</h3>
  <div id="prdContent"></div>
</div>

<!-- Main Content -->
<div class="main-content" id="mainContent">
  <div class="topbar">
    <div class="breadcrumb" id="topbarCrumb"></div>
    <div class="topbar-right">
      <span class="topbar-date" id="topbarDate"></span>
      <div class="user-chip"><span class="user-avatar">HR</span>HR管理员</div>
    </div>
  </div>
  <div id="pageContainer"></div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modalBox" onclick="event.stopPropagation()">
    <div class="modal-close" onclick="closeModal()">&times;</div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ============ MOCK DATA ============
var NAMES = ['张伟','王芳','李娜','刘洋','陈静','杨磊','赵敏','黄强','周婷','吴昊','徐明','孙丽','马超','朱琳','胡斌','郭雪','林峰','何雨','高翔','罗敏'];
var DEPTS = ['技术研发部','产品设计部','市场营销部','人力资源部','财务管理部','运营管理部','客户服务部','数据分析部'];
var BUSS = ['第一事业部','第二事业部','第三事业部','第四事业部'];
var POSITIONS = ['前端工程师','后端工程师','产品经理','UI设计师','测试工程师','数据分析师','市场专员','HR专员','财务专员','运营专员'];
var ONBOARD_STATUS = ['待办理','办理中','审核中','合同签署中','合同已完成','已归档','已失效','放弃入职'];
var REGULAR_STATUS = ['待评估','待审批','审批中','已通过','已完成','已延长','已辞退'];
var TRANSFER_STATUS = ['待审批','原部门已批','新部门已批','已通过','已驳回','已生效'];
var TRANSFER_TYPES = ['平调','晋升','降职','跨事业部调动'];
var RENEW_STATUS = ['待签署','签署中','已完成','不续签'];
var RESIGN_STATUS = ['离职审批已通过','待交接','交接完成','面谈完成','已离职'];
var REWARD_TYPES = ['奖励','惩罚'];
var REWARD_LEVELS = ['特等','一等','二等','三等'];
var TAG_TYPES = ['人才分层','学历认证','特殊人群','项目状态','自定义'];
var TAG_COLORS = ['#8b5cf6','#3b82f6','#f59e0b','#22c55e','#6b7280','#ef4444','#ec4899'];
var EMP_STATUS = ['在职','试用期','已离职'];
var CONTRACT_TYPES = ['固定期限','无固定期限','实习协议','劳务派遣'];

function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
function randDate(y1,y2) { var y=randInt(y1,y2),m=String(randInt(1,12)).padStart(2,'0'),d=String(randInt(1,28)).padStart(2,'0'); return y+'-'+m+'-'+d; }
function maskId(v) { return v ? v.substring(0,3)+'***********'+v.substring(v.length-4) : ''; }
function maskPhone(v) { return v ? v.substring(0,3)+'****'+v.substring(7) : ''; }
function maskBank(v) { return v ? '**** **** **** '+v.substring(v.length-4) : ''; }
function genIdCard() { var area=String(randInt(110000,659999)); var y=randInt(1985,2000); var m=String(randInt(1,12)).padStart(2,'0'); var d=String(randInt(1,28)).padStart(2,'0'); var seq=String(randInt(100,999)); return area+y+m+d+seq+'X'; }
function genPhone() { return '1'+randInt(30,99)+String(randInt(10000000,99999999)); }

var onboardData=[], regularData=[], transferData=[], renewData=[], resignData=[], rewardData=[], tagData=[], employeeData=[];
var punchData=[], shiftData=[], leaveData=[], leaveBalanceData=[], dailyAttData=[], summaryData=[], correctionData=[], auditLogData=[], specialGroupData=[];
var leaveRecordData=[], leaveTypeConfigData=[], leaveApprovalData=[];
var perfIndicatorData=[], perfPlanData=[], perfAssessData=[];

function initData() {
  var i;
  for(i=0;i<45;i++){
    onboardData.push({ id:i+1, name:rand(NAMES), bu:rand(BUSS), dept:rand(DEPTS), pos:rand(POSITIONS), date:randDate(2024,2025), idCard:genIdCard(), phone:genPhone(), source:Math.random()>0.5?'OA':'手动', status:rand(ONBOARD_STATUS) });
  }
  for(i=0;i<38;i++){
    regularData.push({ id:i+1, name:rand(NAMES), dept:rand(DEPTS), pos:rand(POSITIONS), entryDate:randDate(2024,2025), trial:randInt(1,6)+'个月', expectDate:randDate(2025,2025), selfScore:randInt(60,98), status:rand(REGULAR_STATUS) });

// ============ VALIDATION（支持最值/长度/格式边界校验） ============
// 支持的 data- 属性：
//   data-required            必填
//   data-label="手机号"       错误提示中显示的字段名
//   data-min / data-max      数值最值（含边界）
//   data-minlength / data-maxlength  文本长度边界（含边界）
//   data-pattern             正则格式校验
//   data-pattern-msg         格式错误的提示文案
function validateForm(container) {
  if(!container) return false;
  var valid = true;
  var firstError = null;
  var fields = container.querySelectorAll('[data-required],[data-min],[data-max],[data-minlength],[data-maxlength],[data-pattern]');
  fields.forEach(function(f) {
    var label = f.getAttribute('data-label') || '该项';
    var val = (f.value || '').trim();
    var msg = null;
    // 1) 必填
    if(f.hasAttribute('data-required') && !val) {
      msg = label + '为必填项';
    }
    // 2) 数值最值
    else if(val && (f.hasAttribute('data-min') || f.hasAttribute('data-max'))) {
      var num = parseFloat(val);
      var min = f.hasAttribute('data-min') ? parseFloat(f.getAttribute('data-min')) : null;
      var max = f.hasAttribute('data-max') ? parseFloat(f.getAttribute('data-max')) : null;
      if(isNaN(num)) msg = label + '必须为数字';
      else if(min!==null && num < min) msg = label + '不能小于' + min;
      else if(max!==null && num > max) msg = label + '不能大于' + max;
    }
    // 3) 文本长度边界
    else if(val && (f.hasAttribute('data-minlength') || f.hasAttribute('data-maxlength'))) {
      var minLen = f.hasAttribute('data-minlength') ? parseInt(f.getAttribute('data-minlength')) : null;
      var maxLen = f.hasAttribute('data-maxlength') ? parseInt(f.getAttribute('data-maxlength')) : null;
      if(minLen!==null && val.length < minLen) msg = label + '不能少于' + minLen + '个字（当前' + val.length + '字）';
      else if(maxLen!==null && val.length > maxLen) msg = label + '不能超过' + maxLen + '个字（当前' + val.length + '字）';
    }
    // 4) 格式
    else if(val && f.hasAttribute('data-pattern')) {
      var re = new RegExp('^' + f.getAttribute('data-pattern') + '$');
      if(!re.test(val)) msg = f.getAttribute('data-pattern-msg') || (label + '格式不正确');
    }
    // 展示结果
    if(msg) {
      valid = false;
      f.classList.add('error');
      var em = f.parentElement.querySelector('.error-msg');
      if(em) { em.textContent = msg; em.style.display = 'block'; }
      if(!firstError) firstError = { field: f, msg: msg };
    } else if(f.classList.contains('error')) {
      f.classList.remove('error');
      var em2 = f.parentElement.querySelector('.error-msg');
      if(em2) { em2.style.display = 'none'; }
    }
  });
  if(!valid) {
    showToast(firstError ? firstError.msg : '请检查表单填写', 'error');
    if(firstError) firstError.field.focus();
  }
  return valid;
}

// ============ ID CARD PARSE ============
function parseIdCard(val) {
  if(val.length===18) {
    var gender = parseInt(val[16])%2===1?'男':'女';
    var birthday = val.substring(6,10)+'-'+val.substring(10,12)+'-'+val.substring(12,14);
    var gEl = document.getElementById('formGender');
    var bEl = document.getElementById('formBirthday');
    if(gEl){ gEl.value=gender; gEl.disabled=true; }
    if(bEl){ bEl.value=birthday; bEl.disabled=true; }
  }
}

// ============ PAGINATION ============
function renderPagination(key, total) {
  var ps = pageSizeMap[key];
  var totalPages = Math.ceil(total/ps);
  var cp = currentPage[key];
  var btns = '';
  var start = Math.max(1, cp-2);
  var end = Math.min(totalPages, cp+2);
  for(var i=start;i<=end;i++) {
    btns += '<div class="page-btn '+(i===cp?'active':'')+'" onclick="goPage(\''+key+'\','+i+')">'+i+'</div>';
  }
  return '<div class="pagination"><span style="font-size:13px;color:#6b7280;">共 '+total+' 条记录</span><div class="page-btns">'+btns+'</div></div>';
}
function goPage(key, p) { currentPage[key]=p; renderPage(); }
function changePageSize(key, val) { pageSizeMap[key]=parseInt(val); currentPage[key]=1; renderPage(); }
function pageSizeBar(key) {
  return '<div class="page-size-bar">每页展示 <select onchange="changePageSize(\''+key+'\',this.value)"><option value="20" '+(pageSizeMap[key]===20?'selected':'')+'>20</option><option value="50" '+(pageSizeMap[key]===50?'selected':'')+'>50</option><option value="100" '+(pageSizeMap[key]===100?'selected':'')+'>100</option></select> 条数据</div>';
}
function getPageData(arr, key) {
  var ps = pageSizeMap[key]; var cp = currentPage[key];
  return arr.slice((cp-1)*ps, cp*ps);
}

function getStatusBadge(s) {
  if(['待办理','待评估','待审批','待签署','待交接','待审核','待生成'].indexOf(s)>=0) return 'badge-yellow';
  if(['办理中','审批中','签署中','原部门已批','新部门已批','交接完成','员工自评中','上级评价中','上上级审批中','HR复核中','已编辑'].indexOf(s)>=0) return 'badge-blue';
  if(['审核中','合同签署中'].indexOf(s)>=0) return 'badge-purple';
  if(['合同已完成','已通过','已完成','已生效','已归档','面谈完成','离职审批已通过','已确认','已备案','已生成','已锁定'].indexOf(s)>=0) return 'badge-green';
  if(['已失效','放弃入职','已驳回','已辞退','不续签','已离职','已驳回','不合格','已停用'].indexOf(s)>=0) return 'badge-red';
  if(['已延长','草稿','停用','已下架','已暂停'].indexOf(s)>=0) return 'badge-gray';
  if(['上架','可用','已发布','已发放','启用','已完成','已通过','合格'].indexOf(s)>=0) return 'badge-green';
  if(['进行中','已报名','待审批','待审批','待填写'].indexOf(s)>=0) return 'badge-blue';
  if(['下架','待发布','待考试','待学习','未开始','未填写','待评估'].indexOf(s)>=0) return 'badge-yellow';
  return 'badge-gray';
}

function auditReject(id) {
  var r = findOnboard(id);
  if(!r) return;
  closeModal();
  confirmAction('⚠️', '确认不通过「'+r.name+'」的入职审核？', '驳回后，员工需重新修改并提交入职信息。', '确认驳回', true, function(){

function signContract(id) {
  var r = findOnboard(id);
  if(!r || r.status!=='合同签署中') return;
  confirmAction('📝', '确认为「'+r.name+'」发起电子合同签署？', '将调用法大大电子签平台，发起公司代签 + 员工手机签流程。', '发起签署', false, function(){
    showToast('已调用法大大，合同签署流程已发起');

  });
}

function abandonOnboard(id) {
  var r = findOnboard(id);
  if(!r) return;
  if(r.status==='已归档'||r.status==='已失效'||r.status==='放弃入职') return;
  confirmAction('🚫', '确认放弃「'+r.name+'」的入职流程？', '放弃后该记录将标记为「放弃入职」，所有操作按钮置灰，此操作不可撤销。', '确认放弃', true, function(){
    r.status = '放弃入职';
    renderPage();
    showToast('已放弃入职，记录已归档', 'error');
  });
}

function archiveOnboard(id) {
  var r = findOnboard(id);
  if(!r || r.status!=='合同已完成') return;
  var empNo = 'EMP' + String(randInt(10000,99999));
  confirmAction('📁', '确认将「'+r.name+'」归档至员工档案库？', '归档后系统将自动生成工号 '+empNo+'，同步创建员工账号并发送初始密码短信。', '确认归档', false, function(){
    r.status = '已归档';
    employeeData.unshift({ id:employeeData.length+1, name:r.name, empNo:empNo, dept:r.dept, pos:r.pos, entryDate:r.date, phone:r.phone, status:'试用期', idCard:r.idCard, bank:'6222'+String(randInt(1000000000000,9999999999999)) });
    renderPage();
    showToast('归档成功！工号 '+empNo+' 已生成，账号信息已发送至 '+maskPhone(r.phone));

function togglePerfImpact() {
  var sel = document.getElementById('perfLinkSelect');
  var grp = document.getElementById('perfImpactGroup');
  var req = document.getElementById('perfImpactReq');
  var input = document.getElementById('perfImpactInput');
  var isYes = sel && sel.value==='是';
  if(grp) grp.style.display = isYes?'flex':'none';
  // 关联绩效=是 时，绩效影响分值变为条件必填
  if(req) req.style.display = isYes?'inline':'none';
  if(input) {
    if(isYes) input.setAttribute('data-required',''); 
    else input.removeAttribute('data-required');
    if(!isYes) { input.value=''; input.classList.remove('error'); }
  }
}

  if(s==='请假'||s==='出差'||s==='加班'||s==='外勤') return 'badge-blue';

function updateEvalScore(recordId, indIdx, newVal) {
  var r = perfAssessData.find(function(a){return a.id===recordId;});
  if(!r) return;
  var v = Math.max(0, Math.min(100, parseInt(newVal)||0));
  r.indicators[indIdx].superiorScore = v;
  var total = 0;
  for(var j=0;j<r.indicators.length;j++) total += r.indicators[j].superiorScore * r.indicators[j].weight / 100;
  r.totalScore = Math.round(total*10)/10;
  var hdr = document.querySelector('.modal-body div[style*="background:#f8fafc"]');
  if(hdr) {
    var grade = r.totalScore>=90?'S':r.totalScore>=80?'A':r.totalScore>=60?'B':r.totalScore>=40?'C':'D';
    hdr.innerHTML = hdr.innerHTML.replace(/当前综合得分：<b[^>]*>[^<]+<\/b>/, '当前综合得分：<b style="color:#16a34a;">'+r.totalScore+'</b>').replace(/当前等级：<b[^>]*>[^<]+<\/b>/, '当前等级：<b style="color:#ca8a04;">'+grade+'</b>');
  }
}

function renderForcedDist() {
  var gradeCount = {S:0,A:0,B:0,C:0,D:0};
  perfAssessData.forEach(function(r){ gradeCount[r.finalGrade]++; });
  var total = perfAssessData.length;
  var limits = {S:10,A:20,B:40,C:20,D:10};
  var colors = {S:'#7c3aed',A:'#2563eb',B:'#16a34a',C:'#ca8a04',D:'#dc2626'};
  var barsHtml = '';
  var gk;
  for(gk in gradeCount){
    var pct = Math.round(gradeCount[gk]/total*1000)/10;
    var barW = Math.max(pct, 5);
    var targetX = limits[gk];
    barsHtml += '<div class="grade-bar"><div class="bar-label" style="color:'+colors[gk]+'">'+gk+'</div><div class="bar-track"><div class="bar-fill" style="width:'+barW+'%;background:'+colors[gk]+';">'+gradeCount[gk]+'人</div><div class="bar-target" style="left:'+targetX+'%;" title="上限'+targetX+'%"></div></div><div class="bar-value">'+pct+'% / '+(gk==='B'?'≥':'≤')+limits[gk]+'%</div></div>';
  }
  var deptDist = {};
  perfAssessData.forEach(function(r){
    if(!deptDist[r.dept]) deptDist[r.dept] = {S:0,A:0,B:0,C:0,D:0,total:0};
    deptDist[r.dept][r.finalGrade]++;
    deptDist[r.dept].total++;
  });
  var deptRows = '';
  var dk;
  for(dk in deptDist){
    var dd = deptDist[dk];
    var dp = {S:Math.round(dd.S/dd.total*1000)/10,A:Math.round(dd.A/dd.total*1000)/10,B:Math.round(dd.B/dd.total*1000)/10,C:Math.round(dd.C/dd.total*1000)/10,D:Math.round(dd.D/dd.total*1000)/10};
    var warn = dp.S>10||dp.A>20||dp.B<40||dp.C>20||(dp.C+dp.D)<10||dp.D>10;
    deptRows += '<tr><td>'+dk+'</td><td>'+dd.total+'</td><td>'+dd.S+' ('+dp.S+'%)</td><td>'+dd.A+' ('+dp.A+'%)</td><td>'+dd.B+' ('+dp.B+'%)</td><td>'+dd.C+' ('+dp.C+'%)</td><td>'+dd.D+' ('+dp.D+'%)</td><td>'+(warn?'<span class="badge badge-red">需调整</span>':'<span class="badge badge-green">达标</span>')+'</td></tr>';
  }
  return '<div class="page-header"><h1 class="page-title">强制分布校验</h1><button class="btn-primary" onclick="showToast(\'强制分布方案已确认\')">确认分布</button></div>'
  + '<div style="display:flex;gap:16px;margin-bottom:16px;">'
  + '<div style="flex:1;background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);"><div style="font-size:14px;font-weight:600;margin-bottom:14px;">全公司等级分布（共'+total+'人）</div>'+barsHtml+'<div style="font-size:11px;color:#9ca3af;margin-top:8px;">红色竖线 = 强制比例上限/下限</div></div>'
  + '<div style="flex:1;background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);"><div style="font-size:14px;font-weight:600;margin-bottom:14px;">强制分布规则</div>'
  + '<div style="font-size:13px;line-height:2;color:#4b5563;">'
  + 'S（卓越）：≤10% | 综合得分≥90<br>A（优秀）：≤20% | 综合得分80-89<br>B（良好）：≥40% | 综合得分60-79<br>C（待改进）：≤20% | 综合得分40-59<br>D（不合格）：≤10% | 综合得分&lt;40<br>C+D合计：≥10%</div>'
  + '<div style="margin-top:12px;padding:10px;background:#fef2f2;border-radius:6px;font-size:12px;color:#991b1b;">调整优先级：S超限→降最低分S为A | A超限→降最低分A为B | C超限→升最高分C为B | D超限→升最高分D为C</div>'
  + '</div></div>'
  + '<div style="font-size:14px;font-weight:600;margin-bottom:10px;">各部门等级分布</div>'
  + '<div class="table-container"><table><thead><tr><th>部门</th><th>总人数</th><th>S</th><th>A</th><th>B</th><th>C</th><th>D</th><th>校验</th></tr></thead><tbody>'+deptRows+'</tbody></table></div>';

function regenComment(id) {
  var r = perfAssessData.find(function(x){return x.id===id;});
  if(!r) return;
  var newVersion = r.commentVersions.length + 1;
  var newContent = r.commentContent.replace('【总体评价】','【总体评价】[重新生成]');
  r.commentVersions.push({version:newVersion, content:newContent, editor:'系统(AI)', time:'2026-08-07 '+String(randInt(9,17)).padStart(2,'0')+':'+String(randInt(10,59)).padStart(2,'0')});
  r.commentContent = newContent;
  r.commentStatus = '已生成';
  renderPage();
  showToast('评语已重新生成（V'+newVersion+'）');
}

function lockComment(id) {
  var r = perfAssessData.find(function(x){return x.id===id;});
  if(!r) return;
  r.commentStatus = '已确认';
  closeModal();
  renderPage();
  showToast('评语已确认锁定，不可再编辑');
}

function showHexDetail(empId) {
  var emp = dashEmployees.find(function(e){return e.id===empId;});
  if(!emp) return;
  var eduVal = emp.edu>=5?5:emp.edu>=4?4:emp.edu>=3?3:emp.edu>=2?2:1;
  var dilVal = emp.diligence>=4?5:emp.diligence>=3.5?4:emp.diligence>=3?3:emp.diligence>=2?2:1;
  var aiVal = emp.aiExam>=80?5:emp.aiExam>=60?4:emp.aiExam>=40?3:emp.aiExam>=20?2:1;
  var kpiVal = emp.kpi>=95?5:emp.kpi>=85?4:emp.kpi>=75?3:emp.kpi>=60?2:1;
  var mgmtVal = emp.mgmtSpan>=70?5:emp.mgmtSpan>=50?4:emp.mgmtSpan>=30?3:emp.mgmtSpan>=10?2:1;
  var costVal = emp.cost<=20?5:emp.cost<=40?4:emp.cost<=60?3:emp.cost<=80?2:1;
  var growthVal = emp.growth>=80?5:emp.growth>=60?4:emp.growth>=40?3:emp.growth>=20?2:1;
  var projVal = emp.projectTag>=3?5:emp.projectTag>=2.5?4:emp.projectTag>=2?3:emp.projectTag>=1.5?2:1;
  var aiAssessVal = emp.aiAssess>=2.5?5:emp.aiAssess>=2?4:emp.aiAssess>=1.5?3:emp.aiAssess>=1?2:1;
  var dims = [
    {name:'学历',val:eduVal,color:getTrafficColor('edu',emp.edu)},
    {name:'勤奋度',val:dilVal,color:getTrafficColor('diligence',emp.diligence)},
    {name:'AI考试',val:aiVal,color:getTrafficColor('aiExam',emp.aiExam)},
    {name:'KPI',val:kpiVal,color:getTrafficColor('kpi',emp.kpi)},
    {name:'管理幅度',val:mgmtVal,color:getTrafficColor('mgmtSpan',emp.mgmtSpan)},
    {name:'成本',val:costVal,color:getTrafficColor('cost',emp.cost)},
    {name:'个人成长',val:growthVal,color:getTrafficColor('growth',emp.growth)},
    {name:'项目标签',val:projVal,color:getTrafficColor('projectTag',emp.projectTag)},
    {name:'AI评定',val:aiAssessVal,color:getTrafficColor('aiAssess',emp.aiAssess)}
  ];
  var html = '<h4 style="font-size:15px;font-weight:600;margin-bottom:12px">'+emp.name+' ('+emp.id+') - '+emp.dept+'</h4>'
    + '<table style="font-size:13px"><thead><tr><th>维度</th><th style="text-align:center">得分</th><th style="text-align:center">灯色</th></tr></thead><tbody>';
  dims.forEach(function(d){
    var colorName = d.color==='#1a1a1a'?'黑灯':d.color==='#16a34a'?'绿灯':d.color==='#2563eb'?'蓝灯':d.color==='#eab308'?'黄灯':'红灯';
    html += '<tr><td>'+d.name+'</td><td style="text-align:center">'+d.val+'</td><td style="text-align:center"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'+d.color+';vertical-align:middle"></span> '+colorName+'</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('hexDetail').innerHTML = html;
  if(window.hexChartInstance) {
    window.hexChartInstance.data.datasets[0].data = dims.map(function(d){return d.val;});
    window.hexChartInstance.update();
  }
}

function updateHexChart() {
  var sel = document.getElementById('hexEmpSelect');

}

function showEmpDetailModal(empId) {
  var emp = dashEmployees.find(function(e){return e.id===empId;});
  if(!emp) return;
  var eduScore = emp.edu * 20;
  var dilScore = emp.diligence / 5 * 100;
  var perfScore = emp.kpi;
  var costScore = Math.max(0, 100 - emp.cost);
  var growthScore = emp.growth;
  var aiScore = emp.aiAssess / 3 * 100;
  var sixDims = [
    {name:'\u5b66\u5386',score:eduScore,color:getTrafficColor('edu',emp.edu)},
    {name:'\u52e4\u594b\u5ea6',score:dilScore,color:getTrafficColor('diligence',emp.diligence)},
    {name:'\u7ee9\u6548',score:perfScore,color:getTrafficColor('kpi',emp.kpi)},
    {name:'\u6210\u672c\u610f\u8bc6',score:costScore,color:getTrafficColor('cost',emp.cost)},
    {name:'\u6210\u957f\u6f5c\u529b',score:growthScore,color:getTrafficColor('growth',emp.growth)},
    {name:'AI\u80fd\u529b',score:aiScore,color:getTrafficColor('aiAssess',emp.aiAssess)}
  ];
  var avgScore = (sixDims.reduce(function(s,d){return s+d.score;},0)/6).toFixed(1);
  var gradeColor = avgScore>=85?'#16a34a':avgScore>=70?'#2563eb':avgScore>=55?'#eab308':'#dc2626';
  var dimRows = sixDims.map(function(d){
    var lightName = d.color==='#1a1a1a'?'\u9ed1\u706f':d.color==='#16a34a'?'\u7eff\u706f':d.color==='#2563eb'?'\u84dd\u706f':d.color==='#eab308'?'\u9ec4\u706f':'\u7ea2\u706f';
    return '<tr><td>'+d.name+'</td><td style="text-align:right">'+d.score.toFixed(0)+'</td><td style="text-align:center"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+d.color+'"></span> '+lightName+'</td></tr>';
  }).join('');
  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">'
    + '<div>'
    + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'
    + '<div style="width:48px;height:48px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700">'+emp.name.charAt(0)+'</div>'
    + '<div><div style="font-size:18px;font-weight:700">'+emp.name+'</div><div style="font-size:12px;color:#6b7280">'+emp.id+' | '+emp.dept+'</div></div>'
    + '<div style="margin-left:auto;text-align:center"><div style="font-size:28px;font-weight:700;color:'+gradeColor+'">'+avgScore+'</div><div style="font-size:11px;color:#9ca3af">\u7efc\u5408\u8bc4\u5206</div></div></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">\u59d3\u540d</div><div style="font-size:13px;font-weight:500">'+emp.name+'</div></div>'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">\u5de5\u53f7</div><div style="font-size:13px;font-weight:500">'+emp.id+'</div></div>'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">\u90e8\u95e8</div><div style="font-size:13px;font-weight:500">'+emp.dept+'</div></div>'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">\u5e8f\u5217</div><div style="font-size:13px;font-weight:500">'+emp.seq+'</div></div>'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">\u5b66\u5386</div><div style="font-size:13px;font-weight:500">'+['','\u5176\u4ed6','\u5927\u4e13','\u672c\u79d1','\u7855\u58eb','\u535a\u58eb'][emp.edu]+'</div></div>'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">\u7ee9\u6548\u7b49\u7ea7</div><div style="font-size:13px;font-weight:500"><span class="badge badge-'+(emp.perfGrade==='S'?'green':emp.perfGrade==='A'?'blue':emp.perfGrade==='B'?'yellow':'red')+'">'+emp.perfGrade+'</span></div></div>'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">KPI</div><div style="font-size:13px;font-weight:500">'+emp.kpi+'</div></div>'
    + '<div style="background:#f9fafb;padding:8px 12px;border-radius:6px"><div style="font-size:11px;color:#9ca3af">AI\u8003\u8bd5</div><div style="font-size:13px;font-weight:500">'+emp.aiExam+'</div></div></div>'
    + '<table style="font-size:12px;width:100%"><thead><tr><th>\u7ef4\u5ea6</th><th style="text-align:right">\u8bc4\u5206</th><th>\u4fe1\u53f7\u706f</th></tr></thead><tbody>'+dimRows+'</tbody></table></div>'
    + '<div><canvas id="empModalRadar" height="250"></canvas></div></div>';
  openModal(html, true);
  setTimeout(function(){
    var ctx = document.getElementById('empModalRadar');
    if(ctx){
      new Chart(ctx,{type:'radar',data:{labels:sixDims.map(function(d){return d.name;}),datasets:[{label:'\u516d\u7ef4\u8bc4\u4f30',data:sixDims.map(function(d){return d.score;}),borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,0.15)',pointBackgroundColor:sixDims.map(function(d){return d.color;}),pointRadius:5,pointBorderWidth:2}]},options:{responsive:true,scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:20,font:{size:10}}}},plugins:{legend:{display:false}}}});
    }
  },200);
}

  for(var i=0;i<35;i++){
    var day = i-4;
    var hasEvent = (day===1||day===2||day===10||day===11||day===12||day===18||day===25);
    html += '<div style="min-height:80px;padding:4px;border:1px solid #e5e7eb;border-radius:4px;font-size:11px;'+(day<1||day>31?'background:#f9fafb':'')+'">';
    if(day>=1&&day<=31) {
      html += '<div style="font-weight:600;color:#374151;margin-bottom:2px">'+day+'</div>';
      if(day===1) html += '<div style="background:#dbeafe;color:#1d4ed8;padding:1px 4px;border-radius:2px;font-size:10px;margin-bottom:2px">\u5165\u804c\u57f9\u8bad</div>';
      if(day===10) html += '<div style="background:#dcfce7;color:#166534;padding:1px 4px;border-radius:2px;font-size:10px;margin-bottom:2px">Java\u57f9\u8bad</div>';
      if(day===18) html += '<div style="background:#fef9c3;color:#854d0e;padding:1px 4px;border-radius:2px;font-size:10px">\u9879\u76ee\u7ba1\u7406</div>';

function initTrainExamCharts() {
  setTimeout(function(){
