<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR系统 - 人事管理模块</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size:14px; color:#1f2937; background:#f3f4f6; }
.sidebar { width:220px; background:#1e293b; min-height:100vh; position:fixed; left:0; top:0; z-index:50; }
.sidebar-title { padding:20px 16px; color:#fff; font-size:16px; font-weight:600; border-bottom:1px solid #334155; display:flex; align-items:center; gap:8px; }
.sidebar-title svg { width:20px; height:20px; }
.nav-item { padding:12px 20px; color:#94a3b8; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:10px; font-size:14px; border-left:3px solid transparent; }
.nav-item:hover { background:#334155; color:#e2e8f0; }
.nav-item.active { background:#334155; color:#fff; border-left-color:#3b82f6; }
.nav-item svg { width:16px; height:16px; flex-shrink:0; }
.main { margin-left:220px; padding:24px; min-height:100vh; }
.page-header { margin-bottom:20px; }
.page-header h2 { font-size:20px; font-weight:600; color:#111827; }
.page-header p { font-size:13px; color:#6b7280; margin-top:4px; }
.card { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:20px; margin-bottom:16px; }
.filter-bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.filter-bar input, .filter-bar select { height:36px; border:1px solid #d1d5db; border-radius:6px; padding:0 12px; font-size:13px; outline:none; transition:border .2s; }
.filter-bar input:focus, .filter-bar select:focus { border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.1); }
.filter-bar input { width:180px; }
.btn { height:36px; padding:0 16px; border-radius:6px; font-size:13px; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:6px; transition:all .2s; }
.btn-primary { background:#3b82f6; color:#fff; }
.btn-primary:hover { background:#2563eb; }
.btn-outline { background:#fff; color:#374151; border:1px solid #d1d5db; }
.btn-outline:hover { border-color:#3b82f6; color:#3b82f6; }
.btn-success { background:#10b981; color:#fff; }
.btn-success:hover { background:#059669; }
.btn-danger { background:#ef4444; color:#fff; }
.btn-danger:hover { background:#dc2626; }
.btn-sm { height:28px; padding:0 10px; font-size:12px; }
table { width:100%; border-collapse:collapse; }
th { background:#f9fafb; padding:12px; text-align:left; font-size:12px; color:#6b7280; font-weight:500; border-bottom:1px solid #e5e7eb; white-space:nowrap; }
td { padding:12px; border-bottom:1px solid #f3f4f6; font-size:13px; color:#374151; }
tr:hover td { background:#f9fafb; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:500; }
.badge-blue { background:#dbeafe; color:#1d4ed8; }
.badge-green { background:#d1fae5; color:#065f46; }
.badge-yellow { background:#fef3c7; color:#92400e; }
.badge-red { background:#fee2e2; color:#991b1b; }
.badge-gray { background:#f3f4f6; color:#4b5563; }
.badge-purple { background:#ede9fe; color:#5b21b6; }
.pagination { display:flex; align-items:center; justify-content:space-between; margin-top:16px; }
.pagination-info { font-size:13px; color:#6b7280; }
.pagination-btns { display:flex; gap:4px; }
.pagination-btns button { width:32px; height:32px; border:1px solid #d1d5db; background:#fff; border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
.pagination-btns button:hover { border-color:#3b82f6; color:#3b82f6; }
.pagination-btns button.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
.pagination-btns button:disabled { opacity:.4; cursor:not-allowed; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:none; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:12px; width:680px; max-width:90vw; max-height:85vh; overflow-y:auto; padding:24px; }
.modal-lg { width:900px; }
.modal-title { font-size:18px; font-weight:600; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
.modal-title .close-btn { width:32px; height:32px; border:none; background:#f3f4f6; border-radius:6px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
.modal-title .close-btn:hover { background:#e5e7eb; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-group { display:flex; flex-direction:column; gap:4px; }
.form-group.full { grid-column:1/-1; }
.form-group label { font-size:13px; color:#374151; font-weight:500; }
.form-group label .req { color:#ef4444; margin-left:2px; }
.form-group input, .form-group select, .form-group textarea { height:36px; border:1px solid #d1d5db; border-radius:6px; padding:0 12px; font-size:13px; outline:none; transition:border .2s; }
.form-group textarea { height:80px; padding:8px 12px; resize:vertical; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.1); }
.form-group input.error, .form-group select.error { border-color:#ef4444; }
.form-group .error-msg { font-size:12px; color:#ef4444; display:none; }
.form-group .error-msg.show { display:block; }
.form-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid #e5e7eb; }
.tab-bar { display:flex; border-bottom:1px solid #e5e7eb; margin-bottom:16px; gap:0; }
.tab-item { padding:10px 16px; font-size:13px; color:#6b7280; cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
.tab-item:hover { color:#3b82f6; }
.tab-item.active { color:#3b82f6; border-bottom-color:#3b82f6; font-weight:500; }
.detail-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
.detail-item { padding:8px 0; }
.detail-item .label { font-size:12px; color:#9ca3af; margin-bottom:4px; }
.detail-item .value { font-size:14px; color:#1f2937; }
.toast { position:fixed; top:20px; right:20px; background:#10b981; color:#fff; padding:12px 20px; border-radius:8px; font-size:14px; z-index:200; display:none; box-shadow:0 4px 12px rgba(0,0,0,.15); }
.toast.show { display:block; animation:slideIn .3s ease; }
@keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
.empty-state { text-align:center; padding:60px 20px; color:#9ca3af; }
.empty-state svg { width:48px; height:48px; margin:0 auto 12px; opacity:.5; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    人事管理
  </div>
  <div class="nav-item active" data-page="onboard" onclick="switchPage('onboard')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
    入职管理
  </div>
  <div class="nav-item" data-page="confirm" onclick="switchPage('confirm')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    转正管理
  </div>
  <div class="nav-item" data-page="transfer" onclick="switchPage('transfer')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    调动管理
  </div>
  <div class="nav-item" data-page="renew" onclick="switchPage('renew')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    续签管理
  </div>
  <div class="nav-item" data-page="resign" onclick="switchPage('resign')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    离职管理
  </div>
  <div class="nav-item" data-page="reward" onclick="switchPage('reward')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
    奖惩记录
  </div>
  <div class="nav-item" data-page="tag" onclick="switchPage('tag')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    标签管理
  </div>
  <div class="nav-item" data-page="archive" onclick="switchPage('archive')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    员工档案
  </div>
</div>

<div class="main" id="mainContent"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== Mock Data =====
const depts = ['技术研发部','产品设计部','市场营销部','人力资源部','财务部','运营部','客户服务部','数据平台部'];
const positions = ['前端工程师','后端工程师','产品经理','UI设计师','测试工程师','数据分析师','HR专员','财务专员','运营专员','客服主管'];
const names = ['张伟','李娜','王强','刘洋','陈静','杨帆','赵磊','黄丽','周军','吴敏','徐鹏','孙悦','马超','朱婷','胡斌','郭靖','林峰','何雪','罗刚','梁芳'];

function randItem(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randDate(start,end){ const s=new Date(start).getTime(),e=new Date(end).getTime(); return new Date(s+Math.random()*(e-s)).toISOString().slice(0,10); }
function randPhone(){ return '1'+['3','5','7','8','9'][Math.floor(Math.random()*5)]+String(Math.floor(Math.random()*1e9)).padStart(9,'0'); }

// Generate mock data for each module
const onboardData = names.map((n,i)=>({
  id:i+1, name:n, dept:randItem(depts), position:randItem(positions),
  date:randDate('2026-06-01','2026-08-15'), idCard:'110101'+randDate('1990-01-01','2000-12-31').replace(/-/g,'')+String(1000+i*111).slice(0,4),
  phone:randPhone(), status:randItem(['待办理','办理中','审核中','已完成','已失效','放弃入职'])
}));

const confirmData = names.slice(0,12).map((n,i)=>({
  id:i+1, name:n, dept:randItem(depts), position:randItem(positions),
  entryDate:randDate('2026-01-01','2026-04-30'), probation:'3',
  confirmDate:randDate('2026-04-01','2026-07-30'),
  status:randItem(['待申请','考核中','已通过','已延长','已辞退']),
  score:(Math.random()*2+3).toFixed(1)
}));

const transferData = names.slice(0,10).map((n,i)=>({
  id:i+1, name:n, fromDept:randItem(depts), fromPos:randItem(positions),
  toDept:randItem(depts), toPos:randItem(positions),
  type:randItem(['平调','晋升','降职','跨事业部调动']),
  effectDate:randDate('2026-05-01','2026-08-01'),
  status:randItem(['待审批','审批中','已通过','已驳回'])
}));

const renewData = names.slice(0,8).map((n,i)=>({
  id:i+1, name:n, empNo:'EMP'+String(2020+i).padStart(4,'0'),
  contractNo:'HT-2024-'+String(100+i), contractType:randItem(['固定期限','无固定期限','实习协议']),
  expireDate:randDate('2026-07-01','2026-09-30'),
  renewYears:randItem(['1年','2年','3年','5年','无固定期限']),
  renewCount:Math.floor(Math.random()*3),
  status:randItem(['待续签','续签中','已完成','已终止'])
}));

const resignData = names.slice(0,9).map((n,i)=>({
  id:i+1, name:n, dept:randItem(depts), position:randItem(positions),
  reason:randItem(['个人发展','家庭原因','薪酬福利','工作压力','其他']),
  applyDate:randDate('2026-05-01','2026-07-20'),
  lastDay:randDate('2026-07-01','2026-08-30'),
  status:randItem(['待审批','交接中','面谈中','已生效','已撤回'])
}));

const rewardData = names.slice(0,14).map((n,i)=>({
  id:i+1, name:n, type:i%3===0?'惩罚':'奖励',
  level:randItem(['公司级','事业部级','部门级']),
  title:i%3===0?randItem(['迟到通报','违规操作','业绩不达标']):randItem(['季度优秀员工','项目突出贡献','技术创新奖','年度最佳新人']),
  amount:i%3===0?randItem([0,200,500]):randItem([1000,2000,3000,5000]),
  date:randDate('2026-01-01','2026-07-20'),
  approver:randItem(['王总','李总监','张经理'])
}));

const tagData = [
  {id:1,name:'核心人才',type:'人才分层',method:'手动打标',count:23},
  {id:2,name:'潜力之星',type:'人才分层',method:'手动打标',count:15},
  {id:3,name:'待观察',type:'人才分层',method:'手动打标',count:8},
  {id:4,name:'一学985',type:'学历认证',method:'规则自动',count:31},
  {id:5,name:'一学211',type:'学历认证',method:'规则自动',count:45},
  {id:6,name:'一学一本',type:'学历认证',method:'规则自动',count:67},
  {id:7,name:'退役军人',type:'特殊人群',method:'手动打标',count:5},
  {id:8,name:'外籍人员',type:'特殊人群',method:'手动打标',count:3},
  {id:9,name:'外派',type:'项目状态',method:'手动打标',count:12},
  {id:10,name:'驻场',type:'项目状态',method:'手动打标',count:28},
];

const archiveData = names.map((n,i)=>({
  id:i+1, name:n, empNo:'EMP'+String(2020+i).padStart(4,'0'),
  dept:randItem(depts), position:randItem(positions),
  entryDate:randDate('2020-01-01','2026-06-01'),
  status:randItem(['在职','试用期','已离职']),
  phone:randPhone(), contract:randItem(['固定期限','无固定期限'])
}));

// ===== Utility Functions =====
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

function openModal(html, large){ 
  const m=document.getElementById('modalContent');
  m.className = large ? 'modal modal-lg' : 'modal';
  m.innerHTML=html; 
  document.getElementById('modalOverlay').classList.add('show'); 
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

function renderPagination(total, page, pageSize, onPageChange){
  const pages = Math.ceil(total/pageSize);
  let btns = '';
  btns += '<button '+(page<=1?'disabled':'')+' onclick="'+onPageChange+'('+(page-1)+')">&lt;</button>';
  for(let i=1;i<=Math.min(pages,5);i++){
    btns += '<button class="'+(i===page?'active':'')+'" onclick="'+onPageChange+'('+i+')">'+i+'</button>';
  }
  btns += '<button '+(page>=pages?'disabled':'')+' onclick="'+onPageChange+'('+(page+1)+')">&gt;</button>';
  return '<div class="pagination"><span class="pagination-info">共 '+total+' 条记录，第 '+page+'/'+pages+' 页</span><div class="pagination-btns">'+btns+'</div></div>';
}

function validateForm(formId){
  const form = document.getElementById(formId);
  const reqs = form.querySelectorAll('[data-required]');
  let valid = true;
  reqs.forEach(el=>{
    const group = el.closest('.form-group');
    const msg = group.querySelector('.error-msg');
    if(!el.value.trim()){
      el.classList.add('error');
      if(msg) msg.classList.add('show');
      valid = false;
    } else {
      el.classList.remove('error');
      if(msg) msg.classList.remove('show');
    }
  });
  return valid;
}

// ===== Page State =====
let currentPage = 'onboard';
let pageStates = {
  onboard:{page:1}, confirm:{page:1}, transfer:{page:1}, renew:{page:1},
  resign:{page:1}, reward:{page:1}, tag:{page:1}, archive:{page:1, tab:'basic'}
};

function switchPage(page){
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.page===page);
  });
  renderPage();
}

function renderPage(){
  const main = document.getElementById('mainContent');
  switch(currentPage){
    case 'onboard': main.innerHTML = renderOnboard(); break;
    case 'confirm': main.innerHTML = renderConfirm(); break;
    case 'transfer': main.innerHTML = renderTransfer(); break;
    case 'renew': main.innerHTML = renderRenew(); break;
    case 'resign': main.innerHTML = renderResign(); break;
    case 'reward': main.innerHTML = renderReward(); break;
    case 'tag': main.innerHTML = renderTag(); break;
    case 'archive': main.innerHTML = renderArchive(); break;
  }
}

// ===== Onboard Module =====
function renderOnboard(){
  const st = pageStates.onboard;
  const statusMap = {'待办理':'badge-gray','办理中':'badge-blue','审核中':'badge-yellow','已完成':'badge-green','已失效':'badge-red','放弃入职':'badge-gray'};
  const pageSize=8, start=(st.page-1)*pageSize;
  const rows = onboardData.slice(start, start+pageSize);
  let trs = rows.map(r=>'<tr><td>'+r.name+'</td><td>'+r.dept+'</td><td>'+r.position+'</td><td>'+r.date+'</td><td>'+r.idCard.slice(0,6)+'****'+r.idCard.slice(-4)+'</td><td>'+r.phone.slice(0,3)+'****'+r.phone.slice(-4)+'</td><td><span class="badge '+statusMap[r.status]+'">'+r.status+'</span></td><td>'+(r.status==='待办理'?'<button class="btn btn-primary btn-sm" onclick="openOnboardForm('+r.id+')">办理入职</button>':r.status==='审核中'?'<button class="btn btn-success btn-sm" onclick="showToast(\'审核通过，已归档\')">审核</button>':'<button class="btn btn-outline btn-sm" onclick="openOnboardDetail('+r.id+')">查看</button>')+'</td></tr>').join('');
  return '<div class="page-header"><h2>入职管理</h2><p>管理待入职员工办理流程，包括信息填写、电子签合同、审核归档</p></div>'
    +'<div class="card"><div class="filter-bar">'
    +'<input placeholder="姓名搜索" id="ob_name">'
    +'<select id="ob_dept"><option value="">全部部门</option>'+depts.map(d=>'<option>'+d+'</option>').join('')+'</select>'
    +'<input type="date" id="ob_start"> <span style="color:#9ca3af">至</span> <input type="date" id="ob_end">'
    +'<select id="ob_status"><option value="">全部状态</option><option>待办理</option><option>办理中</option><option>审核中</option><option>已完成</option><option>已失效</option><option>放弃入职</option></select>'
    +'<button class="btn btn-primary" onclick="showToast(\'筛选完成\')">查询</button>'
    +'<button class="btn btn-outline" onclick="showToast(\'已重置\')">重置</button>'
    +'<button class="btn btn-primary" style="margin-left:auto" onclick="openOnboardForm(0)">+ 手动录入</button>'
    +'</div></div>'
    +'<div class="card"><table><thead><tr><th>姓名</th><th>部门</th><th>岗位</th><th>入职日期</th><th>身份证号</th><th>手机号码</th><th>状态</th><th>操作</th></tr></thead><tbody>'+trs+'</tbody></table>'
    +renderPagination(onboardData.length, st.page, pageSize, 'onboardPage')+'</div>';
}
function onboardPage(p){ pageStates.onboard.page=p; renderPage(); }

function openOnboardForm(id){
  const isEdit = id>0;

  document.querySelectorAll('#archiveTabs .tab-item').forEach(t=>t.classList.remove('active'));
