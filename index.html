<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR人事管理系统 - 原型</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f1f5f9; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1e293b; z-index: 100; overflow-y: auto; }
.sidebar-logo { padding: 20px 16px; color: #fff; font-size: 18px; font-weight: 700; border-bottom: 1px solid #334155; }
.sidebar-nav { padding: 8px 0; }
.nav-item { display: flex; align-items: center; padding: 12px 20px; color: #94a3b8; cursor: pointer; transition: all .2s; font-size: 14px; }
.nav-item:hover { background: #334155; color: #e2e8f0; }
.nav-item.active { background: #3b82f6; color: #fff; }
.nav-item .nav-icon { width: 20px; margin-right: 10px; text-align: center; }
.main-content { margin-left: 220px; margin-right: 320px; padding: 24px; min-height: 100vh; transition: margin-right .3s; }
.main-content.full-width { margin-right: 0; }
.prd-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; background: #fffbeb; border-left: 1px solid #fbbf24; overflow-y: auto; z-index: 100; padding: 20px; transition: transform .3s; }
.prd-panel.hidden { transform: translateX(100%); }
.prd-toggle { position: fixed; right: 320px; top: 50%; transform: translateY(-50%); z-index: 101; background: #f59e0b; color: #fff; border: none; padding: 12px 6px; cursor: pointer; border-radius: 6px 0 0 6px; writing-mode: vertical-rl; font-size: 12px; transition: right .3s; }
.prd-toggle.panel-hidden { right: 0; }
.prd-note { background: #fff; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; line-height: 1.6; }
.prd-note-title { font-weight: 700; color: #92400e; margin-bottom: 6px; font-size: 13px; }
.highlight { background: #fef08a; padding: 1px 4px; border-radius: 3px; }
.flow { background: #dcfce7; border: 1px solid #86efac; border-radius: 6px; padding: 10px; margin: 8px 0; font-size: 12px; color: #166534; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; color: #1e293b; }
.btn-primary { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background .2s; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn-secondary:hover { background: #f9fafb; }
.btn-danger { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 4px; }
.filter-bar { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.filter-item { display: flex; flex-direction: column; gap: 4px; }
.filter-item label { font-size: 12px; color: #6b7280; }
.filter-item input, .filter-item select { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; min-width: 140px; }
.table-container { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: #f8fafc; }
th { padding: 12px 14px; text-align: left; font-weight: 600; color: #374151; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; color: #4b5563; }
tr:hover { background: #f8fafc; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.badge-blue { background: #dbeafe; color: #1d4ed8; }
.badge-green { background: #dcfce7; color: #166534; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-yellow { background: #fef9c3; color: #854d0e; }
.badge-purple { background: #f3e8ff; color: #6b21a8; }
.badge-gray { background: #f3f4f6; color: #4b5563; }
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.page-btns { display: flex; gap: 4px; }
.page-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-size: 13px; background: #fff; }
.page-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.page-btn:hover:not(.active) { background: #f3f4f6; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; display: flex; align-items: center; justify-content: center; }
.modal-overlay.hidden { display: none; }
.modal { background: #fff; border-radius: 12px; max-height: 90vh; overflow-y: auto; width: 90%; max-width: 800px; padding: 24px; position: relative; }
.modal-lg { max-width: 1100px; }
.modal-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #e5e7eb; }
.modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; font-size: 20px; color: #6b7280; }
.modal-close:hover { background: #f3f4f6; }
.form-section { margin-bottom: 20px; }
.form-section-title { background: #eff6ff; color: #1d4ed8; padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.form-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; color: #6b7280; font-weight: 500; }
.form-group label .req { color: #ef4444; }
.form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; transition: border-color .2s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.1); }
.form-group input.error, .form-group select.error, .form-group textarea.error { border-color: #ef4444; }
.form-group .error-msg { color: #ef4444; font-size: 11px; display: none; }
.form-group input.error ~ .error-msg, .form-group select.error ~ .error-msg, .form-group textarea.error ~ .error-msg { display: block; }
.form-group input:disabled, .form-group select:disabled { background: #f3f4f6; color: #9ca3af; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 999; font-size: 14px; animation: toastIn .3s; }
.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.tab-bar { display: flex; border-bottom: 2px solid #e5e7eb; margin-bottom: 16px; }
.tab-item { padding: 10px 16px; cursor: pointer; font-size: 14px; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab-item.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 600; }
.tab-item:hover { color: #3b82f6; }
.dynamic-row { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 8px; padding: 10px; background: #f8fafc; border-radius: 6px; }
.add-row-btn { color: #3b82f6; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }
.add-row-btn:hover { text-decoration: underline; }
.remove-row-btn { color: #ef4444; cursor: pointer; font-size: 18px; padding: 4px 8px; }
.detail-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
.detail-tab { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; background: #f3f4f6; color: #4b5563; }
.detail-tab.active { background: #3b82f6; color: #fff; }
.detail-content { min-height: 200px; }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.info-item { padding: 8px 0; }
.info-item .info-label { font-size: 12px; color: #9ca3af; margin-bottom: 2px; }
.info-item .info-value { font-size: 14px; color: #1e293b; font-weight: 500; }
.checklist-section { margin-bottom: 16px; }
.checklist-title { font-weight: 600; font-size: 14px; color: #374151; margin-bottom: 8px; }
.checklist-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: #4b5563; }
.checklist-item input[type="checkbox"] { width: 16px; height: 16px; }
.warning-box { background: #fef9c3; border: 1px solid #fbbf24; border-radius: 6px; padding: 10px 14px; font-size: 13px; color: #92400e; margin-bottom: 12px; }
.page-size-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: #6b7280; }
.page-size-bar select { padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
.color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.op-link { color: #3b82f6; cursor: pointer; font-size: 12px; margin-right: 8px; }
.op-link:hover { text-decoration: underline; }
.op-link.danger { color: #ef4444; }
.op-link.disabled { color: #c0c4cc; cursor: not-allowed; pointer-events: none; }
.op-link.danger.disabled { color: #d4a0a0; }
.confirm-box { text-align: center; padding: 20px 0; }
.confirm-box .confirm-icon { font-size: 40px; margin-bottom: 12px; }
.confirm-box .confirm-msg { font-size: 15px; color: #374151; margin-bottom: 8px; line-height: 1.6; }
.confirm-box .confirm-sub { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
.confirm-btns { display: flex; justify-content: center; gap: 12px; }
.confirm-btns .btn-cancel { background: #fff; color: #374151; border: 1px solid #d1d5db; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.confirm-btns .btn-confirm { background: #3b82f6; color: #fff; border: none; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.confirm-btns .btn-confirm-danger { background: #ef4444; color: #fff; border: none; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.link-display { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 14px 16px; margin: 12px 0; display: flex; align-items: center; gap: 10px; }
.link-display input { flex: 1; border: none; background: transparent; font-size: 13px; color: #0369a1; outline: none; }
.link-display .copy-btn { background: #0ea5e9; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">HR人事管理</div>
  <div class="sidebar-nav" id="sidebarNav"></div>
</div>

<!-- PRD Toggle -->
<button class="prd-toggle" id="prdToggle" onclick="togglePrdPanel()">PRD标注</button>

<!-- PRD Panel -->
<div class="prd-panel" id="prdPanel">
  <h3 style="font-size:16px;font-weight:700;color:#92400e;margin-bottom:16px;">PRD 产品标注</h3>
  <div id="prdContent"></div>
</div>

<!-- Main Content -->
<div class="main-content" id="mainContent">
  <div id="pageContainer"></div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modalBox" onclick="event.stopPropagation()">
    <div class="modal-close" onclick="closeModal()">&times;</div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ============ MOCK DATA ============
var NAMES = ['张伟','王芳','李娜','刘洋','陈静','杨磊','赵敏','黄强','周婷','吴昊','徐明','孙丽','马超','朱琳','胡斌','郭雪','林峰','何雨','高翔','罗敏'];
var DEPTS = ['技术研发部','产品设计部','市场营销部','人力资源部','财务管理部','运营管理部','客户服务部','数据分析部'];
var BUSS = ['第一事业部','第二事业部','第三事业部','第四事业部'];
var POSITIONS = ['前端工程师','后端工程师','产品经理','UI设计师','测试工程师','数据分析师','市场专员','HR专员','财务专员','运营专员'];
var ONBOARD_STATUS = ['待办理','办理中','审核中','合同签署中','合同已完成','已归档','已失效','放弃入职'];
var REGULAR_STATUS = ['待评估','待审批','审批中','已通过','已完成','已延长','已辞退'];
var TRANSFER_STATUS = ['待审批','原部门已批','新部门已批','已通过','已驳回','已生效'];
var TRANSFER_TYPES = ['平调','晋升','降职','跨事业部调动'];
var RENEW_STATUS = ['待签署','签署中','已完成','不续签'];
var RESIGN_STATUS = ['离职审批已通过','待交接','交接完成','面谈完成','已离职'];
var REWARD_TYPES = ['奖励','惩罚'];
var REWARD_LEVELS = ['特等','一等','二等','三等'];
var TAG_TYPES = ['人才分层','学历认证','特殊人群','项目状态','自定义'];
var TAG_COLORS = ['#8b5cf6','#3b82f6','#f59e0b','#22c55e','#6b7280','#ef4444','#ec4899'];
var EMP_STATUS = ['在职','试用期','已离职'];
var CONTRACT_TYPES = ['固定期限','无固定期限','实习协议','劳务派遣'];

function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
function randDate(y1,y2) { var y=randInt(y1,y2),m=String(randInt(1,12)).padStart(2,'0'),d=String(randInt(1,28)).padStart(2,'0'); return y+'-'+m+'-'+d; }
function maskId(v) { return v ? v.substring(0,3)+'***********'+v.substring(v.length-4) : ''; }
function maskPhone(v) { return v ? v.substring(0,3)+'****'+v.substring(7) : ''; }
function maskBank(v) { return v ? '**** **** **** '+v.substring(v.length-4) : ''; }
function genIdCard() { var area=String(randInt(110000,659999)); var y=randInt(1985,2000); var m=String(randInt(1,12)).padStart(2,'0'); var d=String(randInt(1,28)).padStart(2,'0'); var seq=String(randInt(100,999)); return area+y+m+d+seq+'X'; }
function genPhone() { return '1'+randInt(30,99)+String(randInt(10000000,99999999)); }

var onboardData=[], regularData=[], transferData=[], renewData=[], resignData=[], rewardData=[], tagData=[], employeeData=[];

function initData() {
  var i;
  for(i=0;i<45;i++){
    onboardData.push({ id:i+1, name:rand(NAMES), bu:rand(BUSS), dept:rand(DEPTS), pos:rand(POSITIONS), date:randDate(2024,2025), idCard:genIdCard(), phone:genPhone(), source:Math.random()>0.5?'OA':'手动', status:rand(ONBOARD_STATUS) });
  }
  for(i=0;i<38;i++){
    regularData.push({ id:i+1, name:rand(NAMES), dept:rand(DEPTS), pos:rand(POSITIONS), entryDate:randDate(2024,2025), trial:randInt(1,6)+'个月', expectDate:randDate(2025,2025), selfScore:randInt(60,98), status:rand(REGULAR_STATUS) });
  }
  for(i=0;i<32;i++){
    transferData.push({ id:i+1, name:rand(NAMES), oldDept:rand(DEPTS), oldPos:rand(POSITIONS), newDept:rand(DEPTS), newPos:rand(POSITIONS), type:rand(TRANSFER_TYPES), effectDate:randDate(2025,2025), status:rand(TRANSFER_STATUS) });
  }
  for(i=0;i<30;i++){
    renewData.push({ id:i+1, name:rand(NAMES), empNo:'EMP'+String(randInt(1000,9999)), contractNo:'HT'+String(randInt(10000,99999)), contractType:rand(CONTRACT_TYPES), expireDate:randDate(2025,2026), renewYears:randInt(1,5)+'年', historyCount:randInt(0,3), status:rand(RENEW_STATUS) });
  }
  for(i=0;i<28;i++){
    resignData.push({ id:i+1, name:rand(NAMES), dept:rand(DEPTS), pos:rand(POSITIONS), reason:rand(['个人发展','家庭原因','薪资不满','工作压力','创业','其他']), applyDate:randDate(2025,2025), lastDay:randDate(2025,2025), status:rand(RESIGN_STATUS) });
  }
  for(i=0;i<35;i++){
    var type=rand(REWARD_TYPES);
    rewardData.push({ id:i+1, name:rand(NAMES), type:type, level:rand(REWARD_LEVELS), subject:type==='奖励'?rand(['季度优秀员工','技术创新奖','团队协作奖','年度贡献奖']):rand(['迟到处罚','违规操作','绩效不达标','纪律处分']), amount:type==='奖励'?randInt(500,10000):randInt(100,2000), effectDate:randDate(2024,2025), approver:rand(NAMES) });
  }
  for(i=0;i<25;i++){
    tagData.push({ id:i+1, name:rand(['高潜人才','管培生','985硕士','海外背景','孕期员工','工伤员工','项目A核心','项目B支援','自定义标签'+i]), type:rand(TAG_TYPES), color:rand(TAG_COLORS), method:Math.random()>0.5?'手动':'规则', count:randInt(0,120) });
  }
  for(i=0;i<50;i++){
    employeeData.push({ id:i+1, name:rand(NAMES), empNo:'EMP'+String(randInt(1000,9999)), dept:rand(DEPTS), pos:rand(POSITIONS), entryDate:randDate(2020,2025), phone:genPhone(), status:rand(EMP_STATUS), idCard:genIdCard(), bank:'6222'+String(randInt(1000000000000,9999999999999)) });
  }
}
initData();

// ============ NAVIGATION ============
var MODULES = [
  { key:'onboard', name:'入职管理', icon:'📋' },
  { key:'regular', name:'转正管理', icon:'✅' },
  { key:'transfer', name:'调动管理', icon:'🔄' },
  { key:'renew', name:'续签管理', icon:'📝' },
  { key:'resign', name:'离职管理', icon:'🚪' },
  { key:'reward', name:'奖惩记录', icon:'🏆' },
  { key:'tag', name:'标签管理', icon:'🏷️' },
  { key:'employee', name:'员工档案', icon:'👤' }
];
var currentModule = 'onboard';
var currentPage = {};
var pageSizeMap = {};
MODULES.forEach(function(m) { currentPage[m.key]=1; pageSizeMap[m.key]=20; });

function renderNav() {
  var nav = document.getElementById('sidebarNav');
  nav.innerHTML = MODULES.map(function(m) {
    return '<div class="nav-item '+(m.key===currentModule?'active':'')+'" onclick="switchPage(\''+m.key+'\')"><span class="nav-icon">'+m.icon+'</span>'+m.name+'</div>';
  }).join('');
}

function switchPage(key) {
  currentModule = key;
  renderNav();
  renderPage();
  renderPrd();
}

// ============ TOAST ============
function showToast(msg, type) {
  type = type || 'success';
  var t = document.createElement('div');
  t.className = 'toast '+type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}

// ============ MODAL ============
function openModal(html, large) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBox').className = 'modal' + (large?' modal-lg':'');
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }
function closeModalOnOverlay(e) { if(e.target===document.getElementById('modalOverlay')) closeModal(); }

// ============ PRD PANEL ============
var prdVisible = true;
function togglePrdPanel() {
  prdVisible = !prdVisible;
  document.getElementById('prdPanel').classList.toggle('hidden', !prdVisible);
  document.getElementById('prdToggle').classList.toggle('panel-hidden', !prdVisible);
  document.getElementById('mainContent').classList.toggle('full-width', !prdVisible);
}

// ============ VALIDATION ============
function validateForm(container) {
  var valid = true;
  var fields = container.querySelectorAll('[data-required]');
  fields.forEach(function(f) {
    var val = (f.value || '').trim();
    if(!val) { f.classList.add('error'); valid=false; }
    else { f.classList.remove('error'); }
  });
  if(!valid) showToast('请填写所有必填字段','error');
  return valid;
}

// ============ ID CARD PARSE ============
function parseIdCard(val) {
  if(val.length===18) {
    var gender = parseInt(val[16])%2===1?'男':'女';
    var birthday = val.substring(6,10)+'-'+val.substring(10,12)+'-'+val.substring(12,14);
    var gEl = document.getElementById('formGender');
    var bEl = document.getElementById('formBirthday');
    if(gEl){ gEl.value=gender; gEl.disabled=true; }
    if(bEl){ bEl.value=birthday; bEl.disabled=true; }
  }
}

// ============ PAGINATION ============
function renderPagination(key, total) {
  var ps = pageSizeMap[key];
  var totalPages = Math.ceil(total/ps);
  var cp = currentPage[key];
  var btns = '';
  var start = Math.max(1, cp-2);
  var end = Math.min(totalPages, cp+2);
  for(var i=start;i<=end;i++) {
    btns += '<div class="page-btn '+(i===cp?'active':'')+'" onclick="goPage(\''+key+'\','+i+')">'+i+'</div>';
  }
  return '<div class="pagination"><span style="font-size:13px;color:#6b7280;">共 '+total+' 条记录</span><div class="page-btns">'+btns+'</div></div>';
}
function goPage(key, p) { currentPage[key]=p; renderPage(); }
function changePageSize(key, val) { pageSizeMap[key]=parseInt(val); currentPage[key]=1; renderPage(); }
function pageSizeBar(key) {
  return '<div class="page-size-bar">每页展示 <select onchange="changePageSize(\''+key+'\',this.value)"><option value="20" '+(pageSizeMap[key]===20?'selected':'')+'>20</option><option value="50" '+(pageSizeMap[key]===50?'selected':'')+'>50</option><option value="100" '+(pageSizeMap[key]===100?'selected':'')+'>100</option></select> 条数据</div>';
}
function getPageData(arr, key) {
  var ps = pageSizeMap[key]; var cp = currentPage[key];
  return arr.slice((cp-1)*ps, cp*ps);
}

// ============ STATUS BADGE HELPER ============
function getStatusBadge(s) {
  if(['待办理','待评估','待审批','待签署','待交接'].indexOf(s)>=0) return 'badge-yellow';
  if(['办理中','审批中','签署中','原部门已批','新部门已批','交接完成'].indexOf(s)>=0) return 'badge-blue';
  if(['审核中','合同签署中'].indexOf(s)>=0) return 'badge-purple';
  if(['合同已完成','已通过','已完成','已生效','已归档','面谈完成','离职审批已通过'].indexOf(s)>=0) return 'badge-green';
  if(['已失效','放弃入职','已驳回','已辞退','不续签','已离职'].indexOf(s)>=0) return 'badge-red';
  if(['已延长'].indexOf(s)>=0) return 'badge-gray';
  return 'badge-gray';
}

// ============ RENDER PAGES ============
function renderPage() {
  var c = document.getElementById('pageContainer');
  switch(currentModule) {
    case 'onboard': c.innerHTML = renderOnboard(); break;
    case 'regular': c.innerHTML = renderRegular(); break;
    case 'transfer': c.innerHTML = renderTransfer(); break;
    case 'renew': c.innerHTML = renderRenew(); break;
    case 'resign': c.innerHTML = renderResign(); break;
    case 'reward': c.innerHTML = renderReward(); break;
    case 'tag': c.innerHTML = renderTag(); break;
    case 'employee': c.innerHTML = renderEmployee(); break;
  }
}
